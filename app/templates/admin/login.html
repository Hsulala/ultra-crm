<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Fitness 後台登入</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1a1a1a; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
        }
        .card { background: #fff; padding: 40px 36px; width: 100%; max-width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
        .brand { text-align: center; margin-bottom: 24px; }
        .brand .dot { width: 10px; height: 10px; background: #f48124; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .brand span.name { font-weight: 900; font-size: 18px; letter-spacing: 0.5px; color: #1a1a1a; }
        h1 { font-size: 15px; font-weight: 500; text-align: center; margin: 0 0 24px; color: #888; }
        input {
            width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 12px;
            border: 1px solid #ddd; font-size: 15px; font-family: inherit;
        }
        input:focus { outline: none; border-color: #f48124; }
        button {
            width: 100%; padding: 12px; background: #f48124; color: #fff; border: none;
            font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
        }
        button:hover { background: #d96a10; }
        .error { color: #c0392b; font-size: 13px; margin-bottom: 12px; background: #fdeaea; padding: 8px 10px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand"><span class="dot"></span><span class="name">ULTRA FITNESS</span></div>
        <h1>後台管理系統</h1>
        {% if denied %}<p class="error">此帳號已被停用，請聯絡店長。</p>{% endif %}
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="/admin/login">
            <input type="text" name="username" placeholder="帳號" required autofocus>
            <input type="password" name="password" placeholder="密碼" required>
            <button type="submit">登入</button>
        </form>
    </div>
</body>
</html>
