<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <title>Ultra Fitness 後台登入</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ec7b2d; --ink: #111; --rule: #d2d0cb; }
        * { box-sizing: border-box; }
        html { background: #e5e4e1 url("/static/marble.png") repeat; background-size: 900px 900px; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; color: var(--ink); font: 15px/1.6 "Noto Sans TC", "PingFang TC", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .card { width: min(390px, 100%); background: #fff; border: 3px solid var(--ink); border-radius: 22px; box-shadow: 8px 8px 0 var(--ink); padding: 30px 28px 28px; }
        .brand h1 { margin: 0; font: italic 800 52px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: -.01em; }
        .brand h1 i { color: var(--accent); font-style: normal; }
        .brand p { margin: 6px 0 0; font-weight: 900; font-size: 20px; }
        form { display: grid; gap: 10px; margin-top: 22px; }
        input { width: 100%; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 10px; font: inherit; background: #fff; color: var(--ink); }
        input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px #fdf1e7; }
        button { margin-top: 8px; padding: 9px 20px; background: var(--accent); color: #fff; border: 2.5px solid var(--ink); border-radius: 999px; box-shadow: 3px 3px 0 var(--ink); font: inherit; font-weight: 800; cursor: pointer; transition: transform .08s, box-shadow .08s; }
        button:hover { background: #e36f20; transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
        button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
        .error { margin: 14px 0 0; padding: 9px 14px; font-weight: 600; color: #a1382a; background: #f5dad4; border: 2px solid var(--ink); border-radius: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand"><h1>Ultra<i>.</i></h1><p>後台管理</p></div>
        {% if denied %}<p class="error">此帳號已被停用，請聯絡店長。</p>{% endif %}
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="/admin/login">
            <input type="text" name="username" placeholder="帳號" required autofocus>
            <input type="password" name="password" placeholder="密碼" required>
            <button type="submit">登入</button>
        </form>
    </div>
</body>
</html>
